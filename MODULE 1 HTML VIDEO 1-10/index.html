<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Complete Practice</title>
</head>
<body>
    
    <!-- 1-2: Text Formatting -->
     <h1>Heading 1</h1>
     <h2>Heading 2</h2>
     <h3>Heading 3</h3>
     <p>This is a paragraph.</p>
     <p> <b>Bold Text</b> and <strong>Strong Text</strong> </p>
     <p><i>Italic Text</i> and <em>Emphasis Text</em></p>
     <p><small>small text</small></p>

<!-- 1-3: Inline Elements vs Block Elements -->
<p>This is a block-level element.</p>
<span>This is an inline element.</span>

<!-- 1-4: Lists  -->

<ol>
    <li>Order Item 1</li>
    <li>Order Item 2</li>
</ol>
<ul>
    <li>Unordered Item 1</li>
    <li>Unordered Item 2</li>
</ul>

<!-- 1-5: Links -->
 <a href="https://google.com" target="_blank">Google</a>
 <a href="#section"> Jump to Section</a>
 <img src="https://i.ibb.co.com/B5shSkdd/a7fc4c6984c6.png" alt="imag of abdus Salam">

</body>
</html>
